<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>حول التطبيق</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    p { color: #8b949e; margin-bottom: 25px; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 25px;
      max-width: 400px;
      width: 100%;
    }
    a.btn {
      display: block;
      background: #238636;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      margin-top: 15px;
    }
    a.btn:active { background: #2ea043; }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .online { background: #1f6feb33; color: #58a6ff; }
    .offline { background: #f8514933; color: #f85149; }
  </style>
</head>
<body>

  <div class="card">
    <h1>ℹ️ حول التطبيق</h1>
    <p>هذه الصفحة الثانية، وهي أيضاً تعمل دون اتصال.</p>

    <a href="index.html" class="btn">→ العودة إلى الصفحة الرئيسية</a>

    <div id="status" class="status online">الحالة: متصل</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    function updateStatus() {
      statusEl.textContent = navigator.onLine ? 'الحالة: متصل ✅' : 'الحالة: دون اتصال ⚡';
      statusEl.className = 'status ' + (navigator.onLine ? 'online' : 'offline');
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
