<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة الرئيسية</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-page: #f0e8d8;
    --text-color: #1b3a1f;
    --frame-color: #2e7d32;
    --frame-height: 50px;
    --frame-text: #ffffff;

    --btn-bg: #2e7d32;
    --btn-text: #ffffff;
    --btn-hover: #1b5e20;
    --btn-shadow: rgba(46,125,50,0.35);
    --btn-shadow-hover: rgba(46,125,50,0.45);
  }

  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    background: var(--bg-page);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
  }

  /* ====== الخلفية المتحركة ====== */
  .animated-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: linear-gradient(135deg, #f0e8d8 0%, #e8dcc8 50%, #f0e8d8 100%);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .animated-bg .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(46, 125, 50, 0.08);
    animation: floatUp linear infinite;
    will-change: transform;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(100vh) scale(0.6);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-20vh) scale(1.1);
      opacity: 0;
    }
  }

  .animated-bg .shape {
    position: absolute;
    border: 2px solid rgba(13, 71, 161, 0.06);
    animation: rotateShape linear infinite;
    will-change: transform;
  }

  @keyframes rotateShape {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ====== الإطار العلوي ====== */
  .top-frame {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--frame-height);
    background: var(--frame-color);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  .frame-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--frame-text);
    letter-spacing: 0.5px;
  }

  /* ====== الإطار السفلي ====== */
  .bottom-frame {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--frame-height);
    background: var(--frame-color);
    z-index: 999;
    box-shadow: 0 -3px 12px rgba(0,0,0,0.2);
  }

  /* ====== الحاوية الرئيسية ====== */
  .main-wrapper {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: calc(var(--frame-height) + 80px) 24px calc(var(--frame-height) + 40px);
    min-height: 100vh;
  }

  /* ====== العنوان (منزّل قليلاً) ====== */
  .app-title {
    font-size: 36px;
    font-weight: 800;
    color: var(--frame-color);
    letter-spacing: -0.5px;
    line-height: 1.3;
    text-align: center;
    text-shadow: 0 2px 10px rgba(46,125,50,0.15);
    animation: titleFadeIn 1s ease-out;
    margin-top: 40px;
    width: 100%;
    max-width: 460px;
  }

  @keyframes titleFadeIn {
    from {
      opacity: 0;
      transform: translateY(-30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ====== قسم الأزرار (مرفوع قليلاً) ====== */
  .bottom-section {
    position: relative;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 20px;
    margin-bottom: 80px;
  }

  /* ====== شكل المثلث خلف الأزرار ====== */
  .triangle-bg {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 420px);
    height: 300px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.08;
    animation: trianglePulse 6s ease-in-out infinite;
  }

  @keyframes trianglePulse {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 0.08; }
    50%      { transform: translateX(-50%) scale(1.05) rotate(2deg); opacity: 0.12; }
  }

  .triangle-bg svg {
    width: 100%;
    height: 100%;
  }

  /* ====== الأزرار ====== */
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  .main-btn {
    width: 100%;
    padding: 18px 28px;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.3px;
    background: var(--btn-bg);
    color: var(--btn-text);
    box-shadow: 0 8px 20px var(--btn-shadow);
  }

  .main-btn:hover {
    background: var(--btn-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 28px var(--btn-shadow-hover);
  }

  .main-btn:active {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px var(--btn-shadow);
  }

  .main-btn .icon {
    font-size: 22px;
    display: inline-block;
    transition: transform 0.3s ease;
  }

  .main-btn:hover .icon { transform: scale(1.15); }

  .main-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.6s ease;
  }
  .main-btn:hover::before { left: 100%; }

  /* ====== استجابة الشاشات ====== */
  @media (max-width: 480px) {
    .app-title { font-size: 28px; margin-top: 30px; }
    .main-btn { padding: 16px 22px; font-size: 16px; border-radius: 14px; }
    .main-btn .icon { font-size: 20px; }
    .triangle-bg { height: 260px; bottom: 10px; }
    .bottom-section { margin-bottom: 60px; }
  }

  @media (max-width: 360px) {
    .app-title { font-size: 24px; margin-top: 20px; }
    .main-btn { padding: 14px 18px; font-size: 15px; }
    .triangle-bg { height: 220px; bottom: 5px; }
    .bottom-section { margin-bottom: 50px; }
  }

  @media (max-height: 700px) {
    .app-title { font-size: 30px; margin-top: 20px; }
    .triangle-bg { height: 240px; }
    .bottom-section { margin-bottom: 50px; }
  }

  @media (max-height: 600px) {
    .app-title { font-size: 26px; margin-top: 10px; }
    .triangle-bg { height: 200px; }
    .bottom-section { margin-bottom: 30px; }
  }
</style>
</head>
<body>

<!-- الخلفية المتحركة -->
<div class="animated-bg" id="animatedBg"></div>

<div class="top-frame">
  <div class="frame-title">📚 التطبيق التعليمي</div>
</div>

<div class="main-wrapper">

  <!-- العنوان (منزّل قليلاً) -->
  <h1 class="app-title">📚 التطبيق التعليمي</h1>

  <!-- قسم الأزرار (مرفوع قليلاً) -->
  <div class="bottom-section">

    <!-- شكل المثلث خلف الأزرار -->
    <div class="triangle-bg" id="triangleBg">
      <svg viewBox="0 0 200 180" preserveAspectRatio="none">
        <polygon points="100,10 190,170 10,170" fill="none" stroke="#2e7d32" stroke-width="2"/>
        <polygon points="100,30 170,160 30,160" fill="none" stroke="#0d47a1" stroke-width="1.5"/>
        <polygon points="100,50 150,150 50,150" fill="none" stroke="#2e7d32" stroke-width="1"/>
      </svg>
    </div>

    <!-- الأزرار -->
    <div class="buttons">
      <button class="main-btn" id="startBtn">
        <span class="icon">▶️</span>
        <span>ابدأ التعلم</span>
      </button>

      <button class="main-btn" id="profileBtn">
        <span class="icon">👤</span>
        <span>الملف الشخصي</span>
      </button>
    </div>

  </div>

</div>

<div class="bottom-frame"></div>

<script>
/* ============================================================
   🎨 الخلفية المتحركة
   ============================================================ */
function createAnimatedBackground() {
  const bg = document.getElementById("animatedBg");

  for (let i = 0; i < 12; i++) {
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const size = 40 + Math.random() * 120;
    bubble.style.width = size + "px";
    bubble.style.height = size + "px";
    bubble.style.left = Math.random() * 100 + "%";
    bubble.style.animationDuration = (12 + Math.random() * 18) + "s";
    bubble.style.animationDelay = (Math.random() * 15) + "s";
    bg.appendChild(bubble);
  }

  for (let i = 0; i < 6; i++) {
    const shape = document.createElement("div");
    shape.className = "shape";
    const size = 60 + Math.random() * 100;
    shape.style.width = size + "px";
    shape.style.height = size + "px";
    shape.style.left = (5 + Math.random() * 90) + "%";
    shape.style.top = (5 + Math.random() * 90) + "%";
    shape.style.borderRadius = Math.random() > 0.5 ? "50%" : "10%";
    shape.style.animationDuration = (20 + Math.random() * 30) + "s";
    shape.style.animationDelay = (Math.random() * 10) + "s";
    bg.appendChild(shape);
  }
}

/* ============================================================
   🔗 روابط الأزرار
   ============================================================ */
const CONFIG = {
  startUrl:   "stages.html",
  profileUrl: "profile.html",
};

document.getElementById('startBtn').onclick = () => {
  window.location.href = CONFIG.startUrl;
};

document.getElementById('profileBtn').onclick = () => {
  window.location.href = CONFIG.profileUrl;
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('startBtn').click();
  }
});

/* ============================================================
   🚀 التشغيل
   ============================================================ */
createAnimatedBackground();

/* ============================================================
   💾 التخزين الدائم + Service Worker
   ============================================================ */
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().then(granted => {
    console.log('💾 التخزين الدائم:', granted ? '✅ ممنوح' : '❌ مرفوض');
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('✅ Service Worker مسجل:', reg.scope);
        setInterval(() => {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'KEEP_ALIVE' });
          }
        }, 30000);
      })
      .catch(err => console.error('❌ فشل تسجيل SW:', err));
  });
}

window.addEventListener('online',  () => console.log('🌐 متصل'));
window.addEventListener('offline', () => console.log('📴 غير متصل'));
</script>

</body>
</html>
