<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>تطبيقي دون اتصال</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    p { color: #8b949e; margin-bottom: 25px; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 25px;
      max-width: 400px;
      width: 100%;
    }
    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    button:active { background: #2ea043; }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .online { background: #1f6feb33; color: #58a6ff; }
    .offline { background: #f8514933; color: #f85149; }
  </style>
</head>
<body>

  <div class="card">
    <h1>👋 مرحباً</h1>
    <p>هذا تطبيق ويب يعمل دون اتصال</p>

    <div id="counter">عدد النقرات: 0</div>
    <button id="clickBtn">اضغط هنا</button>

    <div id="status" class="status online">الحالة: متصل</div>
  </div>

  <script>
    // 1) عداد محفوظ في localStorage
    let count = Number(localStorage.getItem('myCounter')) || 0;
    const counterEl = document.getElementById('counter');
    counterEl.textContent = 'عدد النقرات: ' + count;

    document.getElementById('clickBtn').addEventListener('click', () => {
      count++;
      counterEl.textContent = 'عدد النقرات: ' + count;
      localStorage.setItem('myCounter', count);
    });

    // 2) حالة الاتصال
    const statusEl = document.getElementById('status');
    function updateStatus() {
      if (navigator.onLine) {
        statusEl.textContent = 'الحالة: متصل ✅';
        statusEl.className = 'status online';
      } else {
        statusEl.textContent = 'الحالة: دون اتصال ⚡';
        statusEl.className = 'status offline';
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();

    // 3) تسجيل Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('تم تسجيل SW:', reg.scope))
          .catch(err => console.log('فشل التسجيل:', err));
      });
    }
  </script>
</body>
</html>
