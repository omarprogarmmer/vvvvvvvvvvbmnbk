<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة الرئيسية</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  :root {
    --bg-page: #f0e8d8;
    --text-color: #1b3a1f;
    --frame-color: #2e7d32;
    --frame-height: 50px;
    --frame-text: #ffffff;

    --btn-bg: #2e7d32;
    --btn-text: #ffffff;
    --btn-hover: #1b5e20;
    --btn-shadow: rgba(46,125,50,0.35);
    --btn-shadow-hover: rgba(46,125,50,0.45);
  }

  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    background: var(--bg-page);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .top-frame {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--frame-height);
    background: var(--frame-color);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  .frame-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--frame-text);
    letter-spacing: 0.5px;
  }

  .bottom-frame {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--frame-height);
    background: var(--frame-color);
    z-index: 999;
    box-shadow: 0 -3px 12px rgba(0,0,0,0.2);
  }

  .main-wrapper {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: calc(var(--frame-height) + 40px) 24px calc(var(--frame-height) + 30px);
    min-height: 100vh;
  }

  .content {
    width: 100%;
    max-width: 460px;
    text-align: center;
    animation: fadeIn 0.7s ease;
    margin-top: 100px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .app-title {
    font-size: 36px;
    font-weight: 800;
    color: var(--frame-color);
    margin-bottom: 30px;
    letter-spacing: -0.5px;
    line-height: 1.3;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 100px;
  }

  .main-btn {
    width: 100%;
    padding: 18px 28px;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.3px;
    background: var(--btn-bg);
    color: var(--btn-text);
    box-shadow: 0 8px 20px var(--btn-shadow);
  }

  .main-btn:hover {
    background: var(--btn-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 28px var(--btn-shadow-hover);
  }

  .main-btn:active {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px var(--btn-shadow);
  }

  .main-btn .icon {
    font-size: 22px;
    display: inline-block;
    transition: transform 0.3s ease;
  }

  .main-btn:hover .icon { transform: scale(1.15); }

  .main-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.6s ease;
  }
  .main-btn:hover::before { left: 100%; }

  @media (max-width: 480px) {
    .content { margin-top: 70px; }
    .app-title { font-size: 28px; margin-bottom: 24px; }
    .buttons { margin-top: 70px; }
    .main-btn { padding: 16px 22px; font-size: 16px; border-radius: 14px; }
    .main-btn .icon { font-size: 20px; }
  }

  @media (max-width: 360px) {
    .content { margin-top: 50px; }
    .app-title { font-size: 24px; margin-bottom: 20px; }
    .buttons { margin-top: 50px; }
    .main-btn { padding: 14px 18px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="top-frame">
  <div class="frame-title">📚 التطبيق التعليمي</div>
</div>

<div class="main-wrapper">
  <div class="content">

    <h1 class="app-title">📚 التطبيق التعليمي</h1>

    <div class="buttons">
      <button class="main-btn" id="startBtn">
        <span class="icon">▶️</span>
        <span>ابدأ التعلم</span>
      </button>

      <button class="main-btn" id="profileBtn">
        <span class="icon">👤</span>
        <span>الملف الشخصي</span>
      </button>
    </div>

  </div>
</div>

<div class="bottom-frame"></div>

<script>
const CONFIG = {
  startUrl:   "stages.html",
  profileUrl: "profile.html",
};

document.getElementById('startBtn').onclick = () => {
  window.location.href = CONFIG.startUrl;
};

document.getElementById('profileBtn').onclick = () => {
  window.location.href = CONFIG.profileUrl;
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('startBtn').click();
  }
});
</script>

<!-- ============================================================
     💾 التخزين الدائم + تسجيل Service Worker
     ============================================================ -->
<script>
// 1️⃣ طلب تخزين دائم (يمنع iOS من حذف البيانات)
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().then(granted => {
    console.log('💾 التخزين الدائم:', granted ? '✅ ممنوح' : '❌ مرفوض');
  });
}

// 2️⃣ تسجيل Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('✅ Service Worker مسجل:', reg.scope);

        // إرسال KEEP_ALIVE كل 30 ثانية لإبقاء SW نشطاً
        setInterval(() => {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'KEEP_ALIVE' });
          }
        }, 30000);
      })
      .catch(err => console.error('❌ فشل تسجيل SW:', err));
  });
}

// 3️⃣ عرض حالة الاتصال
window.addEventListener('online',  () => console.log('🌐 متصل'));
window.addEventListener('offline', () => console.log('📴 غير متصل'));
</script>

</body>
</html>
